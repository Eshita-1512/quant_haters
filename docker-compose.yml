services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dz_quant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dz_quant"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/dz_quant
      JWT_SECRET: local-compose-secret-change-before-sharing-123456
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      PRODUCTION_FRONTEND_URL: ${PRODUCTION_FRONTEND_URL:-}
      PRIVATE_DATA_DIR: /app/private_data
      MASTER_VALIDATION_PATH: /app/private_data/master_validation.csv
    ports:
      - "8000:8000"
    volumes:
      - private_data:/app/private_data

volumes:
  postgres_data:
  private_data:
